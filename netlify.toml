[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_PUBLIC_ASSET_PREFIX = "https://live-toro-site.netlify.app"
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Primary domain: toromovers.com (toromovers.net is legacy alias → 301)
[[redirects]]
  from = "https://toromovers.net/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.toromovers.net/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.toromovers.com/*"
  to = "https://toromovers.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://toromudanzas.com/*"
  to = "https://toromovers.com/?utm_source=toromudanzas&utm_medium=redirect"
  status = 301
  force = true

[[redirects]]
  from = "https://www.toromudanzas.com/*"
  to = "https://toromovers.com/?utm_source=toromudanzas&utm_medium=redirect"
  status = 301
  force = true

# Legacy ad domains are hosted on the toro-ads-landing Netlify project and
# 301 to this site (see docs/domain-consolidation.md). SEO home is toromovers.com.

# Moving day checklist: https://toromovers.com/move-day-checklist
# Subdomain job-size.* → /move-day-checklist (src/middleware.ts).
# Legacy /your-move and /job-size redirect to /move-day-checklist.
